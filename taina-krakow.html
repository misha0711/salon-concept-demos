 if(!reduce&&sc){var to=parseFloat(sc.dataset.to),t0=null;sc.textContent='0.0';setTimeout(function(){requestAnimationFrame(function f(ts){t0=t0||ts;var p=Math.min(1,(ts-t0)/1400),e=1-Math.pow(1-p,3);sc.textContent=(to*e).toFixed(1);if(p<1)requestAnimationFrame(f)})},1100)}
